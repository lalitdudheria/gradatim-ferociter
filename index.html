<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradatim Ferociter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <h1 class="motto">Gradatim<br>Ferociter</h1>
    <p class="subtitle">Step by step, ferociously</p>

    <div class="stats hidden" id="whoop-stats">
      <div>
        <div class="stat-label">Recovery</div>
        <div class="stat-value accent" id="stat-recovery">—</div>
      </div>
      <div>
        <div class="stat-label">Sleep</div>
        <div class="stat-value" id="stat-sleep">—</div>
      </div>
      <div>
        <div class="stat-label">HRV</div>
        <div class="stat-value" id="stat-hrv">—</div>
      </div>
      <div>
        <div class="stat-label">RHR</div>
        <div class="stat-value" id="stat-rhr">—</div>
      </div>
    </div>

    <div class="calendar-header">
      <div class="calendar-title" id="month-label"></div>
      <div class="calendar-nav">
        <button id="prev-month" aria-label="Previous month">&larr;</button>
        <button id="next-month" aria-label="Next month">&rarr;</button>
      </div>
    </div>

    <div class="calendar-grid" id="days-grid"></div>
  </div>

  <div id="workout-modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <h2 id="modal-date"></h2>
      <p id="modal-description"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
