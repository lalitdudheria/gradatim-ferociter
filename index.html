<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="site-title">Gradatim Ferociter</h1>
  <main class="calendar-card">
    <header class="calendar-header">
      <h1 id="month-label"></h1>
    </header>
    <div class="weekdays">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div id="days-grid" class="days-grid"></div>
  </main>

  <div id="workout-modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <h2 id="modal-date"></h2>
      <p id="modal-description"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
